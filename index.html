<script>
(function(){
  'use strict';

  const CORES = navigator.hardwareConcurrency || 4;
  const MEM = navigator.deviceMemory || 4;
  const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
  const IS_LOW_END = CORES <= 4 || MEM <= 3 || (IS_TOUCH && window.devicePixelRatio >= 3);
  if(IS_LOW_END) document.body.classList.add('perf-lite');
  const PERF = {
    // Mobile retina capped at 1.5 (was 2) — cuts GPU work nearly in half
    dpr: IS_LOW_END ? 1.25 : (IS_TOUCH ? 1.5 : Math.min(window.devicePixelRatio || 1, 2)),
    shadows: !IS_LOW_END,
    confetti: !IS_LOW_END,
    storyRings: !IS_LOW_END,
    heavyEffects: !IS_LOW_END,
    targetFrameMs: IS_LOW_END ? (1000/40) : 0
  };

  const SERVER_URL='https://dllump-production-0a3d.up.railway.app';
  const WIN_GIFS=['https://i.postimg.cc/9Frvpxhz/ezgif-3f0e907be807d1cc.gif','https://i.postimg.cc/rmQPRSzF/ezgif-20d222277768f496.gif','https://i.postimg.cc/NfyzL2tt/ezgif-2378686847977dc7.gif','https://i.postimg.cc/Gt6zvzCK/ezgif-258589f1cd2da73d.gif','https://i.postimg.cc/Dwr5bqMn/ezgif-26d5d53255cd286f.gif','https://i.postimg.cc/qvTSYBPx/ezgif-2529049603c6d1a9.gif','https://i.postimg.cc/4dqF1Xbk/ezgif-286c5293f9b85b07.gif'];

  const tg=window.Telegram?.WebApp;
  if(tg){
    tg.expand();
    tg.enableClosingConfirmation();
    function applyTgFullscreen(){
      const isFs = !!tg.isFullscreen || (tg.viewportHeight && tg.viewportHeight >= window.innerHeight - 2);
      document.body.classList.toggle('tg-fullscreen', isFs);
    }
    applyTgFullscreen();
    try{ tg.onEvent('fullscreenChanged', applyTgFullscreen); }catch(_){}
    try{ tg.onEvent('viewportChanged', applyTgFullscreen); }catch(_){}
    window.addEventListener('resize', applyTgFullscreen);
  }

  function haptic(style){try{if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred(style||'light');else if(navigator.vibrate)navigator.vibrate(style==='heavy'?30:12)}catch(_){}}
  const $=s=>document.querySelector(s);
  const $$=s=>Array.prototype.slice.call(document.querySelectorAll(s));

  const toastContainer = document.getElementById('toast-container');
  const MAX_TOASTS = 3;
  const TOAST_DURATION = 4200;

  function dismissToast(t){
    if(!t || t.classList.contains('dismissing')) return;
    if(t._autoTimer){ clearTimeout(t._autoTimer); t._autoTimer = null; }
    t.classList.add('dismissing');
    t.classList.remove('show');
    setTimeout(() => { if(t.parentNode) t.parentNode.removeChild(t); }, 340);
  }

  function attachSwipe(t){
    let dragging = false, pid = null;
    let startX = 0, startY = 0, curDx = 0, curDy = 0;
    t.addEventListener('pointerdown', e => {
      if(e.target.closest('.toast-close')) return;
      dragging = true; pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      curDx = 0; curDy = 0;
      t.classList.add('swiping');
      try { t.setPointerCapture(e.pointerId); } catch(_) {}
    });
    t.addEventListener('pointermove', e => {
      if(!dragging || e.pointerId !== pid) return;
      curDx = e.clientX - startX;
      curDy = e.clientY - startY;
      const absX = Math.abs(curDx), absY = Math.abs(curDy);
      let tx = 0, ty = 0;
      if(absX > absY){ tx = curDx; ty = curDy * 0.22; }
      else if(curDy < 0){ tx = curDx * 0.25; ty = curDy; }
      else { tx = curDx * 0.32; ty = curDy * 0.32; }
      const rot = Math.max(-14, Math.min(14, tx * 0.08));
      const op = Math.max(0.25, 1 - Math.max(absX, Math.abs(ty)) / 240);
      t.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
      t.style.opacity = op;
    }, {passive: true});
    const endDrag = e => {
      if(!dragging) return;
      dragging = false;
      t.classList.remove('swiping');
      const absX = Math.abs(curDx), absY = Math.abs(curDy);
      const shouldDismiss = absX > 90 || curDy < -70;
      if(shouldDismiss){
        if(t._autoTimer){ clearTimeout(t._autoTimer); t._autoTimer = null; }
        const isHorizontal = absX > absY;
        t.style.transition = 'transform .32s cubic-bezier(.4,0,.6,1), opacity .26s ease, max-height .28s ease, padding .28s ease, margin .28s ease';
        if(isHorizontal){
          const dir = Math.sign(curDx) || 1;
          t.style.transform = `translate(${dir * (window.innerWidth + 60)}px, ${curDy}px) rotate(${dir * 18}deg)`;
        } else {
          const dir = curDy < 0 ? -1 : 1;
          t.style.transform = `translate(0px, ${dir * 200}px) scale(.85)`;
        }
        t.style.opacity = 0;
        t.classList.add('dismissing');
        setTimeout(() => { if(t.parentNode) t.parentNode.removeChild(t); }, 340);
      } else {
        t.style.transition = '';
        t.style.transform = '';
        t.style.opacity = '';
        if(t._autoTimer) clearTimeout(t._autoTimer);
        t._autoTimer = setTimeout(() => dismissToast(t), TOAST_DURATION);
      }
      curDx = 0; curDy = 0;
    };
    t.addEventListener('pointerup', endDrag);
    t.addEventListener('pointercancel', endDrag);
  }

  function showNotif(text, opts){
    opts = opts || {};
    if(!toastContainer) return;
    const existing = toastContainer.querySelectorAll('.toast:not(.dismissing)');
    if(existing.length >= MAX_TOASTS) dismissToast(existing[0]);
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text == null ? '' : String(text);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'toast-close';
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label','Dismiss');
    closeBtn.textContent = '✕';
    t.appendChild(closeBtn);
    toastContainer.appendChild(t);
    requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
    const dur = opts.duration || TOAST_DURATION;
    t._autoTimer = setTimeout(() => dismissToast(t), dur);
    closeBtn.addEventListener('pointerdown', e => { e.stopPropagation(); dismissToast(t); });
    attachSwipe(t);
  }

  const RIPPLE_SEL='button, .quick-btn, .layout-tile, .round-tile, .swatch, .setting, .top-entry, .stat-card, .panel-user';
  document.addEventListener('pointerdown',e=>{
    if(!PERF.heavyEffects) return;
    const target=e.target.closest(RIPPLE_SEL);
    if(!target)return;
    if(target.closest('.tab-inner'))return;
    const cs=getComputedStyle(target);
    if(cs.position==='static')target.style.position='relative';
    if(cs.overflow!=='hidden')target.style.overflow='hidden';
    const rect=target.getBoundingClientRect();
    const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
    const size=Math.max(rect.width,rect.height)*1.4;
    const rip=document.createElement('span');
    rip.className='ripple-effect';
    rip.style.width=size+'px';rip.style.height=size+'px';
    rip.style.left=(cx-size/2)+'px';rip.style.top=(cy-size/2)+'px';
    target.appendChild(rip);
    setTimeout(()=>{if(rip.parentNode)rip.parentNode.removeChild(rip)},680);
  },{passive:true});

  const state={
    balance:0,username:'player',userId:null,pfp:'',wins:0,losses:0,
    anonymous:false,hidePfp:false,anonymousName:'Anonymous',
    defaultAvatar:'https://i.pravatar.cc/150?img=0',
    topPlayers:[],topPlayerIds:new Map(),winStreak:0,
    transactions:[],maxTx:20,
    memberSince:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    soundEnabled:false,bounceLightsEnabled:false,currentTab:'ice',
    storyRingsEnabled:false
  };
  let SERVER_ARENA_SIZE=400;

  const iceCanvas=document.getElementById('ice-canvas');
  const iceCtx=iceCanvas.getContext('2d',{alpha:true});
  const balanceEl=document.getElementById('bal');
  const usernameDisplay=document.getElementById('un');
  const statusDot=document.getElementById('sd');
  const iceWaitingText=document.getElementById('ice-waiting-text');
  const iceTopPanel=document.getElementById('ice-top-panel');
  const iceCountdownTimer=document.getElementById('ice-countdown-timer');
  const iceTimerProgress=document.getElementById('ice-timer-progress');
  const iceStatsPlayers=document.getElementById('ice-stats-players');
  const iceStatsPot=document.getElementById('ice-stats-pot');
  const iceLastGamePfp=document.getElementById('ice-last-game-pfp');
  const iceLastGameAmount=document.getElementById('ice-last-game-amount');
  const iceBestWinPfp=document.getElementById('ice-best-win-pfp');
  const iceBestWinAmount=document.getElementById('ice-best-win-amount');
  const iceWinPanel=document.getElementById('ice-win-panel');
  const iceWinGif=document.getElementById('ice-win-gif');
  const iceWinAvatar=document.getElementById('ice-win-avatar');
  const iceWinName=document.getElementById('ice-win-name');
  const iceWinMultiplier=document.getElementById('ice-win-multiplier');
  const iceWinContinueBtn=document.getElementById('ice-win-continue-btn');
  const iceBetOverlayWrap=document.getElementById('ice-bet-overlay-wrap');
  const iceBetOverlay=document.getElementById('ice-bet-overlay');
  const iceBetToggleBtn=document.getElementById('ice-bet-toggle-btn');
  const iceBetInput=document.getElementById('ice-bet-input');
  const iceBetBtn=document.getElementById('ice-bet-btn');
  const iceAllInBtn=document.getElementById('ice-all-in-btn');
  const iceCurrentBetDisplay=document.getElementById('ice-current-bet-value');
  const iceAutoToggle=document.getElementById('ice-auto-bet-toggle');
  const iceAutoPanel=document.getElementById('ice-auto-bet-panel');
  const iceAutoSwitch=document.getElementById('ice-auto-bet-switch');
  const iceAutoAmount=document.getElementById('ice-auto-bet-amount');
  const iceAutoSwitchWrap=document.getElementById('ice-auto-switch-wrap');
  const profilePfp=document.getElementById('profile-pfp');
  const profileName=document.getElementById('profile-name');
  const profileUsername=document.getElementById('profile-username');
  const profileStatus=document.getElementById('profile-status');
  const profileDot=document.getElementById('profile-dot');
  const pWins=document.getElementById('p-wins');
  const pLosses=document.getElementById('p-losses');
  const pRate=document.getElementById('p-rate');
  const hidePfpToggle=document.getElementById('hide-pfp-toggle');
  const soundToggle=document.getElementById('sound-toggle');
  const bounceLightsToggle=document.getElementById('bounce-lights-toggle');
  const rankList=document.getElementById('rank-list');
  const panelName=document.getElementById('panel-name');
  const panelSub=document.getElementById('panel-sub');
  const cardBalanceValue=document.getElementById('card-balance-value');
  const cardHolder=document.getElementById('card-holder');

  const socket=(typeof io!=='undefined')?io(SERVER_URL,{transports:['websocket','polling']}):null;
  function setOnline(on){statusDot.classList.toggle('offline',!on);profileDot.classList.toggle('offline',!on);profileStatus.textContent=(on?'● online':'● offline')+' · member since '+state.memberSince}
  if(!socket){console.error('Socket.IO failed');setOnline(false)}
  else{
    socket.on('connect',()=>{
      setOnline(true);
      socket.emit('join',{initData:tg?.initData||''},res=>{
        if(!res?.ok){showNotif('Could not connect');return}
        state.userId=res.user.id;state.username=res.user.username;state.pfp=res.user.pfp||'';
        state.balance=res.user.balance;state.wins=res.user.wins;state.losses=res.user.losses;
        state.anonymous=!!res.user.anonymousEnabled;state.hidePfp=!!res.user.hidePfp;
        state.anonymousName=res.user.anonymousName||'Anonymous';
        SERVER_ARENA_SIZE=res.arena.size;
        iceState.perimeterPoints=res.iceArena?.perimeter||res.arena.perimeter;
        iceState.cornerRadius=res.iceArena?.cornerRadius||res.arena.cornerRadius;
        if(Array.isArray(res.iceRecentWinners)&&res.iceRecentWinners.length){
          iceState.winHistory=res.iceRecentWinners.slice(0,8);
          const last=iceState.winHistory[0];if(last)updateIceLastGamePanel(last);
          const best=iceState.winHistory.reduce((m,e)=>(e.amount||0)>(m.amount||0)?e:m,{amount:0});
          if(best.amount>0){iceState.bestWin=best;updateIceBestWinPanel(best)}
        }
        if(res.icePlayers&&Array.isArray(res.icePlayers)){
          iceState.players=res.icePlayers.map(p=>({id:p.id,name:p.name,pfp:p.pfp,pfpImg:null,x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,dx1:p.x1,dy1:p.y1,dx2:p.x2,dy2:p.y2,color:p.color,bet:p.bet}));
          iceState.pot=res.icePot||0;iceState.players.forEach(p=>loadIcePlayerPFP(p));
        }
        applyIdentity();updateBalance();updateProfile();refreshLeaderboard();refreshCardUI();
        if(window._topRefresh)clearInterval(window._topRefresh);
        window._topRefresh=setInterval(refreshLeaderboard,30000);
        animateWaitingText();setTimeout(resizeIceCanvas,60);
      });
    });
    socket.on('disconnect',()=>setOnline(false));
    socket.on('connect_error',()=>setOnline(false));
    socket.on('iceState',s=>applyIceServerState(s));
    socket.on('iceRoundEnd',p=>handleIceRoundEnd(p));
    socket.on('icePuckBounce',d=>{if(!d||!state.bounceLightsEnabled)return;iceState.wallPulses.push({x:d.x,y:d.y,intensity:d.intensity||.6,startTime:performance.now(),duration:700});if(iceState.wallPulses.length>6)iceState.wallPulses.shift()});
    socket.on('notification',d=>{if(d?.message)showNotif(d.message)});
  }

  function applyIdentity(){
    usernameDisplay.textContent='@'+state.username;
    profileName.textContent=state.username;profileUsername.textContent='@'+state.username;
    panelName.textContent=state.username;
    panelSub.textContent='@'+state.username+' · '+state.balance.toLocaleString()+' ◆';
    cardHolder.textContent=state.username.toUpperCase().slice(0,16);
    const pfpUrl=state.hidePfp?state.defaultAvatar:(state.pfp||state.defaultAvatar);
    profilePfp.src=pfpUrl;
    const pp=$('#panel-pfp');if(pp)pp.src=pfpUrl;
    profileStatus.textContent=(state.anonymous?'● anonymous':'● online')+' · member since '+state.memberSince;
    hidePfpToggle.checked=state.hidePfp;
    soundToggle.checked=state.soundEnabled;
    bounceLightsToggle.checked=state.bounceLightsEnabled;
  }

  let balanceAnimInterval=null;
  function animateBalanceTo(target){
    const current=parseInt(balanceEl.textContent)||0;
    if(current===target){balanceEl.textContent=target;return}
    if(balanceAnimInterval)clearInterval(balanceAnimInterval);
    const diff=target-current,steps=Math.min(Math.abs(diff),30),ss=diff/steps;
    let step=0;
    balanceAnimInterval=setInterval(()=>{
      step++;const v=Math.round(current+ss*step);
      if(step>=steps||Math.abs(v-target)<1){balanceEl.textContent=target;clearInterval(balanceAnimInterval);balanceAnimInterval=null}
      else balanceEl.textContent=v;
    },25);
  }
  function updateBalance(){
    const target=Math.floor(state.balance);
    animateBalanceTo(target);
    const cv=cardBalanceValue.querySelector('span');if(cv)cv.textContent=target.toLocaleString();
    panelSub.textContent='@'+state.username+' · '+target.toLocaleString()+' ◆';
  }
  function updateProfile(){
    pWins.textContent=state.wins;pLosses.textContent=state.losses;
    const total=state.wins+state.losses;
    pRate.textContent=total>0?Math.round(state.wins/total*100)+'%':'0%';
  }

  function addTransaction(type,amount,label){
    state.transactions.unshift({type,amount,label:label||'Bet',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    if(state.transactions.length>state.maxTx)state.transactions.pop();
    refreshTransactions();refreshCardStats();
  }
  function refreshTransactions(){
    const list=$('#tx-list');if(!list)return;
    if(state.transactions.length===0){list.innerHTML='<div class="tx-empty">No transactions yet</div>';return}
    let html='';
    state.transactions.forEach(tx=>{const s=tx.amount>0?'+':'';html+='<div class="tx-entry"><span>'+tx.label+'</span><span class="tx-amount '+tx.type+'">'+s+tx.amount+'</span></div>'});
    list.innerHTML=html;
  }
  function refreshCardStats(){
    let w=0,b=0,n=0;
    state.transactions.forEach(tx=>{if(tx.type==='bet')w+=Math.abs(tx.amount);else if(tx.type==='win'){n+=tx.amount;if(tx.amount>b)b=tx.amount}else if(tx.type==='loss')n+=tx.amount});
    const we=$('#cs-wagered'),bi=$('#cs-biggest'),ne=$('#cs-net');
    if(we)we.textContent=w;if(bi)bi.textContent=b;
    if(ne){ne.textContent=(n>=0?'+':'')+n;ne.className='cs-value'+(n>0?' positive':n<0?' negative':' neutral')}
  }
  function refreshCardUI(){refreshTransactions();refreshCardStats()}

  function refreshLeaderboard(){
    if(!socket)return;
    socket.emit('leaderboard',{},res=>{
      if(!res?.ok)return;
      state.topPlayers=res.top.map((u,i)=>{const a=u.anonymousEnabled||false;return{id:u.id,name:a?(u.anonymousUsername||'Anonymous'):u.username,pfp:a?'':u.pfp,wins:u.wins,score:u.balance,rank:i+1,anonymous:a}});
      state.topPlayerIds.clear();
      state.topPlayers.forEach(p=>state.topPlayerIds.set(p.id,{rank:p.rank}));
      renderRanks();
    });
  }
  function renderRanks(){
    if(!rankList)return;
    if(state.topPlayers.length===0){rankList.innerHTML='<div class="rank-empty"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M17 4H7v6a5 5 0 0 0 10 0zM7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3"/></svg>No players yet — be the first!</div>';return}
    let html='';
    state.topPlayers.forEach(p=>{
      const r=p.rank;let rc='rank';
      if(r===1)rc+=' gold';else if(r===2)rc+=' silver';else if(r===3)rc+=' bronze';
      const pfp=p.anonymous?state.defaultAvatar:(p.pfp||state.defaultAvatar);
      html+='<div class="top-entry"><div class="'+rc+'">#'+r+'</div><img class="t-pfp" src="'+pfp+'" onerror="this.src=\''+state.defaultAvatar+'\'"><div class="t-name">'+p.name+'</div><div class="t-wins">'+p.wins+' wins</div><div class="t-score">'+p.score+'</div></div>';
    });
    rankList.innerHTML=html;
  }

  const tabPages={ice:$('#ice-page'),wallet:$('#wallet-page'),profile:$('#profile-page'),top:$('#top-page')};
  const tabOrder=['ice','wallet','profile','top'];
  const tabBtns=$$('.tab');
  const tabInner=$('#tab-inner');
  const indicator=$('#tab-indicator');
  let current='ice';
  let dragTab=false,tabMoved=false,tabStartX=0,tabStartPx=0,tabHoverIdx=0,tabDownTab=null;

  function tabWidth(){return tabInner?(tabInner.clientWidth-12)/tabBtns.length:0}
  function updateIndicator(animate){
    if(!indicator)return;
    const idx=tabOrder.indexOf(current);
    const w=tabWidth();
    if(!animate)indicator.classList.add('dragging');
    indicator.style.width=w+'px';
    indicator.style.transform='translate3d('+(idx*w)+'px,0,0)';
    if(!animate){void indicator.offsetWidth;requestAnimationFrame(()=>indicator.classList.remove('dragging'))}
  }

  tabInner.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    dragTab=true;tabMoved=false;
    tabStartX=e.clientX;
    tabStartPx=tabOrder.indexOf(current)*tabWidth();
    tabHoverIdx=tabOrder.indexOf(current);
    const el=e.target.closest?e.target.closest('.tab'):null;
    tabDownTab=el?el.dataset.tab:null;
    indicator.classList.add('dragging');
    indicator.classList.add('grow');
    e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!dragTab)return;
    const dx=e.clientX-tabStartX;
    if(Math.abs(dx)>4)tabMoved=true;
    const tw=tabWidth();
    const mx=(tabBtns.length-1)*tw;
    const x=Math.max(0,Math.min(mx,tabStartPx+dx));
    indicator.style.transform='translate3d('+x+'px,0,0)';
    const over=Math.round(x/tw);
    if(over!==tabHoverIdx){tabHoverIdx=over;haptic('light');for(let i=0;i<tabBtns.length;i++)tabBtns[i].classList.toggle('active',i===over)}
  },{passive:true});
  document.addEventListener('pointerup',e=>{
    if(!dragTab)return;
    dragTab=false;
    indicator.classList.remove('dragging');
    indicator.classList.remove('grow');
    const tw=tabWidth();const mx=(tabBtns.length-1)*tw;
    if(!tabMoved){
      for(let i=0;i<tabBtns.length;i++)tabBtns[i].classList.toggle('active',tabOrder[i]===current);
      updateIndicator(true);
      if(tabDownTab&&tabDownTab!==current)switchTab(tabDownTab);
      tabDownTab=null;return;
    }
    const dx=e.clientX-tabStartX;
    const bias=Math.max(-1,Math.min(1,dx/200))*(tw*.15);
    const ex=Math.max(0,Math.min(mx,tabStartPx+dx+bias));
    const ti=Math.round(ex/tw);const tt=tabOrder[ti];
    if(tt!==current)switchTab(tt);
    else{for(let j=0;j<tabBtns.length;j++)tabBtns[j].classList.toggle('active',tabOrder[j]===current);updateIndicator(true)}
    tabDownTab=null;
  });
  document.addEventListener('pointercancel',()=>{
    if(!dragTab)return;
    dragTab=false;
    indicator.classList.remove('dragging');
    indicator.classList.remove('grow');
    updateIndicator(true);tabDownTab=null;
  });

  function switchTab(tab){
    if(tab===current||!tabPages[tab])return;
    haptic('light');
    const oldEl=tabPages[current];oldEl.classList.remove('active');oldEl.classList.add('exit');
    setTimeout(()=>oldEl.classList.remove('exit'),350);
    tabBtns.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    current=tab;state.currentTab=tab;
    updateIndicator(true);
    requestAnimationFrame(()=>{
      const np=tabPages[tab];np.classList.add('active');
      if(tab==='ice')setTimeout(resizeIceCanvas,60);
      if(tab==='top')refreshLeaderboard();
    });
  }
  setTimeout(()=>updateIndicator(false),100);
  window.addEventListener('resize',()=>updateIndicator(false));
  window.addEventListener('orientationchange',()=>setTimeout(()=>{updateIndicator(false);resizeIceCanvas()},250));

  function easeOutCubic(t){return 1-Math.pow(1-t,3)}
  function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
  function lightenColor(hex,amt){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return'#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0')}

  const PUCK_RENDER_RADIUS=17;

  function drawLiquidGlassPuck(c,x,y,r,opts){
    opts=opts||{};
    const scale=r/36;
    const rim=(opts.rimRatio!==undefined?opts.rimRatio:.36)*r;
    const outer=(opts.outerRatio!==undefined?opts.outerRatio:.32)*r;

  function pushPuckSnapshot(x, y, vx, vy) {

  function getInterpolatedPuck() {
    const n = puckBuffer.length;
    if (n === 0) return { x: iceState.puck.x, y: iceState.puck.y };
    const renderTime = performance.now() - PUCK_INTERP_DELAY;
    if (renderTime <= puckBuffer[0].t) return { x: puckBuffer[0].x, y: puckBuffer[0].y };
    for (let i = 0; i < n - 1; i++) {
      const s0 = puckBuffer[i];
      const s1 = puckBuffer[i + 1];
      if (renderTime >= s0.t && renderTime <= s1.t) {
        const dt = s1.t - s0.t;
        if (dt <= 0.001) return { x: s1.x, y: s1.y };
        let a = (renderTime - s0.t) / dt;
        if (a < 0) a = 0; else if (a > 1) a = 1;

    const ahead = Math.min(renderTime - last.t, PUCK_INTERP_DELAY);

  /* ─── PLAYER TILE SPRITE CACHE ────────────────────── */
  function getPlayerTileSprite(p, w, h) {
    const rw = Math.max(1, Math.round(w));
    const rh = Math.max(1, Math.round(h));
    const key = rw + ':' + rh + ':' + p.color;
    if (p._spriteKey === key && p._sprite) return p._sprite;
    const dpr = PERF.dpr;
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(rw * dpr);
    cv.height = Math.ceil(rh * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fg = c.createLinearGradient(0, 0, rw, rh);
    fg.addColorStop(0, lightenColor(p.color, 35));
    fg.addColorStop(0.5, p.color);
    fg.addColorStop(1, lightenColor(p.color, 20));
    c.fillStyle = fg;
    c.fillRect(0, 0, rw, rh);
    p._sprite = cv;
    p._spriteKey = key;
    return cv;
  }

  function renderIce(){
    const w=iceState.arenaSize;if(!w)return;
    const half=w/2;const s=iceScaleFactor();
    iceCtx.clearRect(0,0,w,w);

    if(!rinkCache || rinkCacheSize!==w) buildRinkCache();
    if(rinkCache) iceCtx.drawImage(rinkCache,0,0,w,w);
    if(!cachedPerimeterPath || cachedPerimeterSize!==w) buildRinkCache();
    const path=cachedPerimeterPath;
    if(!path) return;

    let zoomActive=iceState.zoom>1.05;
    if(zoomActive&&iceState.zoomCenterFixed){
      const csx=iceState.zoomCenterX*s,csy=iceState.zoomCenterY*s;
      const tx=(half-csx)*iceState.zoom+half-half*iceState.zoom;
      const ty=(half-csy)*iceState.zoom+half-half*iceState.zoom;
      iceCtx.save();iceCtx.translate(tx,ty);iceCtx.scale(iceState.zoom,iceState.zoom);
      if(rinkCache) iceCtx.drawImage(rinkCache,0,0,w,w);
    }

    if(iceState.gameState==='countdown' && iceState.countdownPulseStart){
      const age=(performance.now()-iceState.countdownPulseStart)/1000;
      if(age<0.9){
        const t=age/0.9;
        const e=1-Math.pow(1-t,3);
        const alpha=(1-e)*0.75;
        const blur=8+e*55;
        iceCtx.save();
        iceCtx.shadowColor='rgba(255,255,255,'+alpha+')';
        iceCtx.shadowBlur=blur;
        iceCtx.strokeStyle='rgba(255,255,255,'+(alpha*0.6)+')';
        iceCtx.lineWidth=2+(1-e)*3;
        iceCtx.lineJoin='round';
        iceCtx.stroke(path);
        iceCtx.restore();
      }
    }

    if(iceState.gameState==='idle' && PERF.shadows){
      iceState.glowPhase+=.03;
      const pulse=.3+.7*(.5+.5*Math.sin(iceState.glowPhase));
      const alpha=.10+.22*pulse,blur=22+34*pulse;
      iceCtx.save();iceCtx.shadowColor='rgba(180,210,255,'+alpha+')';iceCtx.shadowBlur=blur;iceCtx.strokeStyle='rgba(180,210,255,'+(alpha*.45)+')';iceCtx.lineWidth=5;iceCtx.lineJoin='round';iceCtx.stroke(path);iceCtx.restore();
    }

    if(iceState.gameState==='idle'){
      if(!iceState.idlePuckInitialized){
        iceState.idlePuck.x=w/2;iceState.idlePuck.y=w/2;
        const angle=Math.random()*Math.PI*2,speed=2+Math.random()*1.5;
        iceState.idlePuck.vx=Math.cos(angle)*speed;iceState.idlePuck.vy=Math.sin(angle)*speed;
        iceState.idlePuck.radius=PUCK_RENDER_RADIUS;iceState.idlePuckInitialized=true;
      }
      let x=iceState.idlePuck.x,y=iceState.idlePuck.y,vx=iceState.idlePuck.vx,vy=iceState.idlePuck.vy;
      x+=vx;y+=vy;const r=iceState.idlePuck.radius,margin=18;
      if(x-r<margin){x=margin+r;vx=-vx}if(x+r>w-margin){x=w-margin-r;vx=-vx}
      if(y-r<margin){y=margin+r;vy=-vy}if(y+r>w-margin){y=w-margin-r;vy=-vy}
      iceState.idlePuck.x=x;iceState.idlePuck.y=y;iceState.idlePuck.vx=vx;iceState.idlePuck.vy=vy;
      drawPuckSprite(iceCtx,x,y,PUCK_RENDER_RADIUS*s);
      if(iceState.players.length===0){if(zoomActive)iceCtx.restore();return}
    }

    const now=performance.now();
    const puck=iceState.puck;
    let rpx,rpy;
    if(iceState.gameState==='sliding'){
      const ip=getInterpolatedPuck();
      rpx=ip.x; rpy=ip.y;
    } else {
      rpx=puck.x; rpy=puck.y;
    }

    if(iceState.gameState==='sliding'){
      if(iceState.lastFrameTime>0){
        const dt=(now-iceState.lastFrameTime)/1000;
        if(dt>.005&&dt<.5){
          const dx=rpx-iceState.prevRenderX,dy=rpy-iceState.prevRenderY;
          const spd=Math.sqrt(dx*dx+dy*dy)/dt;
          if(spd>iceState.peakSpeed)iceState.peakSpeed=spd;
          const elapsed=(now-iceState.slideStartTime)/1000;
          if(!iceState.zoomFired && elapsed > 0.6 && spd < 1.5 && spd < iceState.peakSpeed * 0.30){
            iceState.zoomCenterX = puck.x;
            iceState.zoomCenterY = puck.y;
            iceState.zoomCenterFixed = true;
            iceState.isZoomingIn = true;
            iceState.zoomStartTime = now;
            iceState.zoomTarget = 1.35;
            iceState.zoomFired = true;
            iceState.zoomDuration = 0.55;
          }
          if(iceState.zoomFired && !iceState.zoomOutTriggered && spd < 0.4){
            iceState.zoomOutTriggered = true;
            iceState.isZoomingOut = true;
            iceState.isZoomingIn = false;
            iceState.zoomStartTime = now;
            iceState.zoomTarget = 1;
            iceState.zoomDuration = 1.1;
          }
        }
      }
      iceState.prevRenderX=rpx;iceState.prevRenderY=rpy;iceState.lastFrameTime=now;
    }

    if(iceState.zoomCenterFixed && iceState.gameState==='sliding' && !iceState.isZoomingOut){
      const track=0.22;
      iceState.zoomCenterX += (puck.x - iceState.zoomCenterX)*track;
      iceState.zoomCenterY += (puck.y - iceState.zoomCenterY)*track;
    }

    if(iceState.isZoomingOut){
      const elapsed=(now-iceState.zoomStartTime)/1000,p=Math.min(elapsed/iceState.zoomDuration,1),e=easeInOutCubic(p);
      iceState.zoom=iceState.zoomTarget+(1-iceState.zoomTarget)*(1-e);
      const cX=SERVER_ARENA_SIZE/2, cY=SERVER_ARENA_SIZE/2;
      iceState.zoomCenterX += (cX - iceState.zoomCenterX)*0.11;
      iceState.zoomCenterY += (cY - iceState.zoomCenterY)*0.11;
      if(p>=1){iceState.isZoomingOut=false;iceState.zoom=1;iceState.zoomLocked=false;iceState.zoomOutTriggered=false;iceState.zoomCenterFixed=false;}
    }
    if(iceState.isZoomingIn){
      const elapsed=(now-iceState.zoomStartTime)/1000,p=Math.min(elapsed/iceState.zoomDuration,1),e=easeInOutCubic(p);
      iceState.zoom=1+(iceState.zoomTarget-1)*e;
      if(p>=1){iceState.isZoomingIn=false;iceState.zoomLocked=true;iceState.zoom=iceState.zoomTarget;}
    }
    const speed=Math.sqrt(Math.pow(rpx-iceState.puckPrevX,2)+Math.pow(rpy-iceState.puckPrevY,2));

    iceCtx.save();iceCtx.clip(path);

    // Smooth lerp of field positions toward target (280ms ease)
    const lerpT = Math.min(1, (now - (iceState._lastLerpT||now)) / 280);
    iceState._lastLerpT = now;

    iceState.players.forEach(p=>{
      // Lerp display fields toward actual
      const k = 0.22;
      p.dx1 += (p.x1 - p.dx1) * k;
      p.dy1 += (p.y1 - p.dy1) * k;
      p.dx2 += (p.x2 - p.dx2) * k;
      p.dy2 += (p.y2 - p.dy2) * k;

      const x1=p.dx1*s,y1=p.dy1*s,x2=p.dx2*s,y2=p.dy2*s;
      const segW=x2-x1,segH=y2-y1;
      if (segW <= 0 || segH <= 0) return;
      const isWinner=(iceState.gameState==='finished'&&iceState.winnerId===p.id);

      // Blit cached tile sprite instead of creating gradients every frame
      const sprite = getPlayerTileSprite(p, segW, segH);
      iceCtx.globalAlpha = isWinner ? 1 : 0.92;
      iceCtx.drawImage(sprite, x1, y1, segW, segH);
      if (isWinner) {
        // subtle white overlay highlight
        iceCtx.save();
        iceCtx.globalAlpha = 0.35;
        iceCtx.fillStyle = '#ffffff';
        iceCtx.fillRect(x1, y1, segW, segH);
        iceCtx.restore();
      }
      iceCtx.globalAlpha = 1;

      const avatarR=Math.min(segW,segH)*.32;
      let pfpScale=1;const pd=iceState.pfpPop.get(p.id);
      if(pd){const e=(now-pd.startTime)/1000,pr=Math.min(e/(pd.duration/1000),1);if(pr<1){pfpScale=Math.min(1.2,Math.max(0,easeOutBack(pr)))}else iceState.pfpPop.delete(p.id)}
      const drawR=avatarR*pfpScale;
      const cx=(x1+x2)/2,cy=(y1+y2)/2;

      iceCtx.save();
      iceCtx.beginPath();iceCtx.arc(cx,cy,drawR,0,Math.PI*2);iceCtx.closePath();iceCtx.clip();
      const isMe=p.id===state.userId,isAnon=isMe&&state.anonymous,hidePfp=isMe&&state.hidePfp;
      if(isAnon||hidePfp){
        iceCtx.fillStyle=getAnonymousColor(state.userId);
        iceCtx.fillRect(cx-drawR,cy-drawR,drawR*2,drawR*2);
        iceCtx.fillStyle='#fff';iceCtx.font='bold '+(drawR*.8)+'px system-ui, sans-serif';
        iceCtx.textAlign='center';iceCtx.textBaseline='middle';
        iceCtx.fillText((state.anonymousName||'A').charAt(0).toUpperCase(),cx,cy);
      }else if(p.pfpImg&&p.pfpImg.complete&&p.pfpImg.naturalWidth>0){
        iceCtx.drawImage(p.pfpImg,cx-drawR,cy-drawR,drawR*2,drawR*2);
      }else{iceCtx.fillStyle=p.color||'#555';iceCtx.fillRect(cx-drawR,cy-drawR,drawR*2,drawR*2)}
      iceCtx.restore();
    });

    if(iceState.confetti.length){
      const nowC=performance.now();
      iceState.confetti=iceState.confetti.filter(c=>{
        const age=(nowC-c.born)/1000;
        if(age*1000>=c.life)return false;
        c.vy+=320*(1/60);c.x+=c.vx*(1/60);c.y+=c.vy*(1/60);c.rot+=c.vrot*(1/60);c.vx*=0.985;
        const lifeT=age*1000/c.life;
        const alpha=1-Math.pow(lifeT,2);
        iceCtx.save();
        iceCtx.globalAlpha=alpha;
        iceCtx.translate(c.x*s,c.y*s);
        iceCtx.rotate(c.rot);
        iceCtx.fillStyle=c.color;
        iceCtx.fillRect(-c.w*s/2,-c.h*s/2,c.w*s,c.h*s);
        iceCtx.restore();
        return true;
      });
    }

    iceCtx.restore();

    const pn=performance.now();
    if(iceState.wallPulses.length){
      iceState.wallPulses=iceState.wallPulses.filter(pulse=>{
        const elapsed=pn-pulse.startTime;
        if(elapsed>=pulse.duration)return false;
        const t=elapsed/pulse.duration;
        let alpha=(t<.15)?t/.15:1-(t-.15)/.85;
        alpha=Math.max(0,Math.min(1,alpha));
        const pxp=pulse.x*s,pyp=pulse.y*s,r=(20+t*60)*s;
        const gd=iceCtx.createRadialGradient(pxp,pyp,0,pxp,pyp,r);
        gd.addColorStop(0,'rgba(180,210,255,'+(alpha*.95*pulse.intensity)+')');
        gd.addColorStop(.35,'rgba(180,210,255,'+(alpha*.35*pulse.intensity)+')');
        gd.addColorStop(1,'rgba(180,210,255,0)');
        iceCtx.save();iceCtx.fillStyle=gd;
        iceCtx.beginPath();iceCtx.arc(pxp,pyp,r,0,Math.PI*2);iceCtx.fill();
        iceCtx.restore();return true;
      });
    }

    if(iceState.gameState==='spinning'&&iceState.spinStartTime){
      const elapsed=(Date.now()-iceState.spinStartTime)/1000;
      const t=Math.min(1,elapsed/(iceState.spinDuration||1));
      const angle=iceState.spinFinalAngle-(1-easeOutCubic(t))*(4*Math.PI*2);
      const centerX=iceState.spinStartX*s,centerY=iceState.spinStartY*s;
      const puckR=PUCK_RENDER_RADIUS*s,orbit=puckR+4;
      const triSize=Math.min(w*.035,10),tipOffset=triSize*.4;
      iceCtx.save();iceCtx.translate(centerX,centerY);iceCtx.rotate(angle);iceCtx.translate(orbit,0);
      iceCtx.beginPath();iceCtx.moveTo(tipOffset,0);iceCtx.lineTo(-tipOffset*.3,-triSize*.5);iceCtx.lineTo(-tipOffset*.3,triSize*.5);iceCtx.closePath();
      iceCtx.fillStyle='#e8f4ff';iceCtx.shadowColor='rgba(180,210,255,.9)';iceCtx.shadowBlur=14;iceCtx.fill();iceCtx.shadowBlur=0;
      iceCtx.strokeStyle='rgba(180,210,255,.45)';iceCtx.lineWidth=1;iceCtx.stroke();
      iceCtx.restore();
    }

    if(iceState.puckVisible){
      const nowMs=performance.now();
      let scale=1;
      if(iceState.puckPopStart){
        const p=Math.min((nowMs-iceState.puckPopStart)/400,1);
        scale=Math.max(0,Math.min(1.2,easeOutBack(p)));
        if(p>=1)iceState.puckPopStart=0;
      }
      let ws=1;
      if(iceState.winnerPuckPop){
        const t=Math.min(1,(nowMs-iceState.winnerPuckPopStart)/iceState.winnerPuckPopDuration);
        const e=1-Math.pow(1-t,3);
        ws=1+(1.06-1)*Math.sin(e*Math.PI*2)*(1-t);
        if(t>=1){ws=1;iceState.winnerPuckPop=false}
      }
      const total=scale*ws;
      let px,py;
      if(iceState.gameState==='spinning'){px=iceState.spinStartX*s;py=iceState.spinStartY*s}
      else{px=rpx*s;py=rpy*s}
      const r=PUCK_RENDER_RADIUS*s*total;
      drawPuckSprite(iceCtx,px,py,r);
      const isSlow=speed<2&&iceState.gameState==='sliding';
      let ownerName='';
      if(iceState.players.length>0&&iceState.gameState==='sliding'){
        for(const p of iceState.players){
          if(rpx>=p.x1&&rpx<=p.x2&&rpy>=p.y1&&rpy<=p.y2){ownerName=p.name||'Player';break}
        }
      }
      if(isSlow&&ownerName){iceState.currentOwnerName=ownerName;iceState.showOwnerName=true;iceState.nameFadeIn=Math.min(1,iceState.nameFadeIn+.03)}
      else if(!isSlow||!ownerName){iceState.nameFadeIn=Math.max(0,iceState.nameFadeIn-.02);if(iceState.nameFadeIn<=0)iceState.showOwnerName=false}
      if(iceState.showOwnerName&&iceState.currentOwnerName&&iceState.nameFadeIn>.1){
        const alpha=iceState.nameFadeIn*.6,fs=Math.max(9,Math.min(14,r*.9));
        iceCtx.save();iceCtx.globalAlpha=alpha;iceCtx.textAlign='center';iceCtx.textBaseline='top';
        iceCtx.font='bold '+fs+'px system-ui, sans-serif';
        iceCtx.fillStyle='rgba(255,255,255,.9)';iceCtx.shadowColor='rgba(0,0,0,.9)';iceCtx.shadowBlur=6;
        let dn=iceState.currentOwnerName;if(dn.length>10)dn=dn.slice(0,9)+'…';
        iceCtx.fillText(dn,px,py+r+4);iceCtx.restore();
      }
    }
    if(zoomActive)iceCtx.restore();
  }

  let lastFrameTs=0;
  function renderLoop(ts){
    requestAnimationFrame(renderLoop);
    if(state.currentTab!=='ice')return;
    if(document.hidden)return;
    if(PERF.targetFrameMs && ts && lastFrameTs && (ts - lastFrameTs) < PERF.targetFrameMs) return;
    lastFrameTs = ts || performance.now();
    const now=Date.now();
    if(iceState.gameState==='countdown'&&iceState.countdownStartTime){
      const elapsed=(now-iceState.countdownStartTime)/1000;
      const remaining=Math.max(0,10-elapsed);
      const secs=Math.floor(remaining),ms=Math.floor((remaining-secs)*100);
      iceCountdownTimer.textContent=secs+'.'+String(ms).padStart(2,'0');
      iceTimerProgress.style.width=(Math.min(1,elapsed/10)*100)+'%';
      const inCinematic=remaining<=3.05&&remaining>0;
      iceCountdownTimer.classList.toggle('cinematic',inCinematic);
      iceCountdownTimer.classList.toggle('urgent',remaining<=1.05&&remaining>0);
      if(inCinematic&&secs!==iceState.countdownLastSecond){
        iceState.countdownLastSecond=secs;
        iceState.countdownPulseStart=now;
        iceCountdownTimer.classList.remove('tick');
        void iceCountdownTimer.offsetWidth;
        iceCountdownTimer.classList.add('tick');
        haptic(secs<=1?'heavy':'medium');
      }
      if(!inCinematic&&iceState.countdownLastSecond!==-1) iceState.countdownLastSecond=-1;
    }
    updateIceTopPanelVisibility();
    renderIce();
  }

      if(state.storyRingsEnabled){
        const row=storyRingsToggle.closest('.setting');
        if(row){const rect=row.getBoundingClientRect();spawnStoryRing(rect.left+rect.width-42, rect.top+rect.height/2, 56);}
      }
    });
  }
  const STORY_RING_SEL='button, .tab, .quick-btn, .setting, .round-tile, .layout-tile, .swatch, .panel-tab, .top-entry, .ice-bet-toggle';
  document.addEventListener('pointerdown',e=>{
    if(!state.storyRingsEnabled)return;
    const target=e.target.closest(STORY_RING_SEL);
    if(!target)return;
    const rect=target.getBoundingClientRect();
    const base=Math.min(rect.width,rect.height);
    const size=Math.max(34, Math.min(70, base*0.95));
    spawnStoryRing(e.clientX,e.clientY,size);
  },{passive:true});

  function applyBgBlur(on){
    document.body.setAttribute('data-bg-blur',on?'on':'off');
    const b1=$('#bg-blur-toggle'),b2=$('#bg-blur-toggle-2');
    if(b1)b1.checked=on;if(b2)b2.checked=on;
    try{localStorage.setItem('dllump_bg_blur',on?'on':'off')}catch(e){}
  }
  function applyBgImage(on){
    document.body.setAttribute('data-bg-image',on?'on':'off');
    const i1=$('#bg-image-toggle'),i2=$('#bg-image-toggle-2');
    if(i1)i1.checked=on;if(i2)i2.checked=on;
    try{localStorage.setItem('dllump_bg_image',on?'on':'off')}catch(e){}
  }
  [$('#bg-blur-toggle'),$('#bg-blur-toggle-2')].filter(Boolean).forEach(el=>el.addEventListener('change',()=>{haptic('light');applyBgBlur(el.checked)}));
  [$('#bg-image-toggle'),$('#bg-image-toggle-2')].filter(Boolean).forEach(el=>el.addEventListener('change',()=>{haptic('light');applyBgImage(el.checked)}));
  try{applyBgBlur((localStorage.getItem('dllump_bg_blur')||'on')==='on')}catch(e){applyBgBlur(true)}
  try{applyBgImage((localStorage.getItem('dllump_bg_image')||'on')==='on')}catch(e){applyBgImage(true)}

  const promoBtn=$('#promo-btn'),promoMsg=$('#promo-message');
  promoBtn.addEventListener('click',async()=>{
    haptic('light');
    const inp=$('#promo-input');const code=inp.value.trim().toUpperCase();
    if(!code){promoMsg.textContent='Enter a code.';promoMsg.style.color='var(--red)';return}
    if(!state.userId){promoMsg.textContent='Not logged in.';promoMsg.style.color='var(--red)';return}
    const key='dllump_promo_'+state.userId;
    if(localStorage.getItem(key)==='1'){promoMsg.textContent='Already used a promo.';promoMsg.style.color='var(--red)';return}
    promoBtn.disabled=true;promoBtn.textContent='...';promoMsg.textContent='';
    try{
      const r=await fetch(SERVER_URL+'/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,userId:state.userId})});
      const d=await r.json();
      if(d.ok){localStorage.setItem(key,'1');state.balance=d.newBalance;updateBalance();promoMsg.textContent='✅ +'+d.amount+' added';promoMsg.style.color='var(--green)';inp.value='';addTransaction('win',d.amount,'Promo Bonus');haptic('medium');showNotif('Promo applied · +'+d.amount)}
      else{promoMsg.textContent=d.error||'Invalid code';promoMsg.style.color='var(--red)'}
    }catch(e){promoMsg.textContent='Network error';promoMsg.style.color='var(--red)'}
    finally{promoBtn.disabled=false;promoBtn.textContent='Redeem'}
  });

  function initWalletCard(){
    const container=$('#wallet-card-container');
    const card=$('#wallet-card');
    const glare=$('#card-glare');
    const sheen=document.querySelector('.card-sheen');
    const starsContainer=$('#card-stars');
    if(!container||!card)return;
    if(starsContainer){
      starsContainer.innerHTML='';
      const starCount = PERF.heavyEffects ? 40 : 15;
      for(let i=0;i<starCount;i++){
        const s=document.createElement('div');s.className='star';
        s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';
        s.style.animationDelay=(Math.random()*3)+'s';
        s.style.animationDuration=(2+Math.random()*3)+'s';
        const sz=Math.random()*1.6+.5;
        s.style.width=sz+'px';s.style.height=sz+'px';
        starsContainer.appendChild(s);
      }
    }
    let dragging=false,lastX=0,lastY=0,dragOffX=0,dragOffY=0,velX=0,velY=0,rotX=0,rotY=0,flipped=false,flipProgress=0;
    const start=performance.now();let downTime=0,moved=false,pid=null;const MAX=32;
    let cardActive=false;
    function tick(now){
      if(!cardActive){requestAnimationFrame(tick);return}
      const t=(now-start)/1000;
      const baseRotX=Math.sin(t*.45)*9+Math.sin(t*.78)*3;
      const baseRotY=Math.cos(t*.55)*13+Math.cos(t*.92)*4;
      if(!dragging){dragOffX+=velX;dragOffY+=velY;velX*=.93;velY*=.93;dragOffX*=.985;dragOffY*=.985;if(Math.abs(dragOffX)<.04)dragOffX=0;if(Math.abs(dragOffY)<.04)dragOffY=0}
      dragOffX=Math.max(-MAX,Math.min(MAX,dragOffX));dragOffY=Math.max(-MAX,Math.min(MAX,dragOffY));
      const tf=flipped?180:0;flipProgress+=(tf-flipProgress)*.085;
      const tX=baseRotX+dragOffX,tY=baseRotY+dragOffY+flipProgress;
      rotX+=(tX-rotX)*.18;rotY+=(tY-rotY)*.18;
      card.style.transform='rotateX('+rotX.toFixed(2)+'deg) rotateY('+rotY.toFixed(2)+'deg)';
      if(glare){const gx=50+(rotY/MAX)*42,gy=50-(rotX/MAX)*42;const bright=.28+Math.min(.25,Math.abs(rotX+rotY)/90*.35);glare.style.background='radial-gradient(circle at '+Math.max(-15,Math.min(115,gx)).toFixed(1)+'% '+Math.max(-15,Math.min(115,gy)).toFixed(1)+'%,rgba(255,255,255,'+(bright*1.4).toFixed(3)+') 0%,rgba(255,255,255,'+(bright*.35).toFixed(3)+') 25%,transparent 55%)'}
      if(sheen){const hx=50+rotY*1.4,hy=50-rotX*1.4;sheen.style.backgroundPosition=hx.toFixed(1)+'% '+hy.toFixed(1)+'%'}
      requestAnimationFrame(tick);
    }
    const observer=new MutationObserver(()=>{ cardActive = document.getElementById('wallet-page').classList.contains('active'); });
    observer.observe(document.getElementById('wallet-page'),{attributes:true,attributeFilter:['class']});
    requestAnimationFrame(tick);
    container.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      dragging=true;moved=false;downTime=performance.now();pid=e.pointerId;
      lastX=e.clientX;lastY=e.clientY;velX=0;velY=0;
      try{container.setPointerCapture(e.pointerId)}catch(_){}
    });
    document.addEventListener('pointermove',e=>{
      if(!dragging||(pid!==null&&e.pointerId!==pid))return;
      const dx=e.clientX-lastX,dy=e.clientY-lastY;
      if(Math.abs(dx)>1.5||Math.abs(dy)>1.5)moved=true;
      dragOffY+=dx*.55;dragOffX-=dy*.55;velX=-dy*.40;velY=dx*.40;
      lastX=e.clientX;lastY=e.clientY;
    },{passive:true});
    document.addEventListener('pointerup',e=>{
      if(!dragging)return;if(pid!==null&&e.pointerId!==pid)return;
      dragging=false;pid=null;
      if(!moved&&performance.now()-downTime<400){flipped=!flipped;haptic('light')}
    });
  }

  let layoutMode='panel';
  try{layoutMode=localStorage.getItem('dllump_layout')||'panel'}catch(e){}
  function applyLayout(mode){
    layoutMode=mode;document.body.setAttribute('data-layout',mode);
    try{localStorage.setItem('dllump_layout',mode)}catch(e){}
    const sw=$('#layout-switch');if(sw)sw.checked=(mode==='panel');
    $$('.layout-tile').forEach(t=>t.classList.toggle('active',t.dataset.layoutTile===mode));
    const hint=$('#panel-hint');
    if(mode==='simple'){if(hint)hint.classList.add('hidden');if(panelOpen)closePanel()}
    else{if(hint)hint.classList.remove('hidden')}
  }
  const panel=$('#panel'),panelBackdrop=$('#panel-backdrop'),panelHint=$('#panel-hint');
  let panelOpen=false;
  function openPanel(){if(layoutMode!=='panel'||panelOpen)return;panelOpen=true;haptic('medium');panel.classList.add('open');panelBackdrop.classList.add('show');panelHint.classList.add('hidden')}
  function closePanel(){if(!panelOpen)return;panelOpen=false;haptic('light');panel.classList.remove('open');panelBackdrop.classList.remove('show');if(layoutMode==='panel')panelHint.classList.remove('hidden')}
  panelHint.addEventListener('click',openPanel);
  $('#menu-btn').addEventListener('click',openPanel);
  $('#panel-close').addEventListener('click',closePanel);
  $('#grabber').addEventListener('click',closePanel);
  panelBackdrop.addEventListener('click',closePanel);

  let edgeDrag=false,edgeStartX=0,edgeStartY=0;
  document.addEventListener('pointerdown',e=>{if(panelOpen||layoutMode!=='panel')return;if(e.clientX<=24){edgeDrag=true;edgeStartX=e.clientX;edgeStartY=e.clientY}},{passive:true});
  document.addEventListener('pointermove',e=>{if(!edgeDrag)return;if(e.clientX-edgeStartX>40&&Math.abs(e.clientY-edgeStartY)<30){edgeDrag=false;openPanel()}},{passive:true});
  document.addEventListener('pointerup',()=>edgeDrag=false,{passive:true});

  $$('.panel-tab').forEach(t=>t.addEventListener('click',()=>{
    haptic('light');
    $$('.panel-tab').forEach(x=>x.classList.toggle('active',x===t));
    $$('.panel-view').forEach(v=>v.classList.toggle('active',v.id==='pview-'+t.dataset.ptab));
  }));
  $$('[data-action]').forEach(el=>el.addEventListener('click',()=>{
    const a=el.dataset.action;haptic('light');
    if(['ice','wallet','profile','top'].includes(a)){closePanel();setTimeout(()=>switchTab(a),220)}
  }));

  function applyTheme(name){
    document.documentElement.setAttribute('data-theme',name);
    try{localStorage.setItem('dllump_theme',name)}catch(e){}
    $$('#theme-swatches .swatch').forEach(x=>x.classList.toggle('active',x.dataset.theme===name));
  }
  $$('#theme-swatches .swatch').forEach(s=>s.addEventListener('click',()=>{haptic('light');applyTheme(s.dataset.theme)}));
  try{applyTheme(localStorage.getItem('dllump_theme')||'onyx')}catch(e){applyTheme('onyx')}

  function applyRound(name){
    document.body.setAttribute('data-round',name);
    let st=$('#round-style');
    if(!st){st=document.createElement('style');st.id='round-style';document.head.appendChild(st)}
    const sc=name==='sharp'?.4:name==='round'?1.5:1;
    st.textContent='.card,.settings-list,.stat-card,.tab-inner,.promo input,.promo button,.top-entry{border-radius:'+(16*sc)+'px !important}.card-face,.card-sheen,.card-shine,.card-glare{border-radius:'+(22*sc)+'px !important}';
    $$('#round-tiles .round-tile').forEach(x=>x.classList.toggle('active',x.dataset.round===name));
    try{localStorage.setItem('dllump_round',name)}catch(e){}
  }
  $$('#round-tiles .round-tile').forEach(t=>t.addEventListener('click',()=>{haptic('light');applyRound(t.dataset.round)}));
  try{applyRound(localStorage.getItem('dllump_round')||'normal')}catch(e){applyRound('normal')}

  $$('.layout-tile').forEach(t=>t.addEventListener('click',()=>{haptic('light');applyLayout(t.dataset.layoutTile)}));
  const ls=$('#layout-switch');if(ls)ls.addEventListener('change',()=>{haptic('light');applyLayout(ls.checked?'panel':'simple')});

  (function(){
    const bp=document.getElementById('bp');
    const chip=document.getElementById('bet-drag-chip');
    const iceCanvasEl=document.getElementById('ice-canvas');
    if(!bp||!chip||!iceCanvasEl)return;
    const HOLD_MS=400;
    const BET_AMOUNT=10;
    let holding=false, dragging=false, bouncedOut=false;
    let holdTimer=null, holdPointerId=null;
    let startX=0, startY=0;
    let bpRect=null;
    function canBetNow(){
      if(state.currentTab!=='ice')return false;
      const g=iceState.gameState;
      return (g==='idle'||g==='countdown');
    }
    function cleanup(){
      holding=false; dragging=false; bouncedOut=false;
      clearTimeout(holdTimer); holdTimer=null;
      try{ if(holdPointerId!=null) bp.releasePointerCapture(holdPointerId); }catch(_){}
      bp.classList.remove('charging','charged','bounce-out');
      chip.classList.remove('show','over-arena','dropping','drop-into','bounce-back');
      chip.style.left='-9999px';chip.style.top='-9999px';
      holdPointerId=null;
    }
    bp.addEventListener('pointerdown',e=>{
      if(e.button!==undefined && e.button!==0)return;
      if(!canBetNow())return;
      if(holding||dragging)return;
      holding=true;holdPointerId=e.pointerId;
      startX=e.clientX; startY=e.clientY;
      bpRect=bp.getBoundingClientRect();
      bp.classList.add('charging');
      try{ bp.setPointerCapture(e.pointerId); }catch(_){}
      clearTimeout(holdTimer);
      holdTimer=setTimeout(()=>{
        if(!holding)return;
        holding=false;dragging=true;bouncedOut=false;
        haptic('medium');
        bp.classList.remove('charging');
        bp.classList.add('charged');
        chip.style.left=startX+'px';chip.style.top=startY+'px';
        chip.classList.add('show');
      },HOLD_MS);
    });
    document.addEventListener('pointermove',e=>{
      if(holding){
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if(Math.sqrt(dx*dx+dy*dy)>10){holding=false;clearTimeout(holdTimer);bp.classList.remove('charging');}
        return;
      }
      if(!dragging)return;
      chip.style.left=e.clientX+'px';chip.style.top=e.clientY+'px';
      const r=iceCanvasEl.getBoundingClientRect();
      const over=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      chip.classList.toggle('over-arena',over);
      if(!bouncedOut && bpRect){
        const inside=e.clientX>=bpRect.left&&e.clientX<=bpRect.right&&e.clientY>=bpRect.top&&e.clientY<=bpRect.bottom;
        if(!inside){bouncedOut=true;bp.classList.remove('charged');bp.classList.add('bounce-out');setTimeout(()=>bp.classList.remove('bounce-out'),620);}
      }
    },{passive:true});
    document.addEventListener('pointerup',e=>{
      clearTimeout(holdTimer);
      if(holding){holding=false;bp.classList.remove('charging');return;}
      if(!dragging)return;
      dragging=false;
      chip.classList.remove('over-arena');
      const r=iceCanvasEl.getBoundingClientRect();
      const over=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      if(over){
        placeIceBet(BET_AMOUNT);
        haptic('heavy');
        const cx=r.left+r.width/2, cy=r.top+r.height/2;
        chip.classList.add('dropping','drop-into');
        chip.style.left=cx+'px';chip.style.top=cy+'px';
        setTimeout(cleanup,460);
      } else {
        chip.classList.add('dropping','bounce-back');
        if(bpRect){chip.style.left=(bpRect.left+bpRect.width/2)+'px';chip.style.top=(bpRect.top+bpRect.height/2)+'px';}
        setTimeout(cleanup,520);
      }
    });
    document.addEventListener('pointercancel',cleanup);
  })();

  function init(){
    if(tg?.initDataUnsafe?.user){const u=tg.initDataUnsafe.user;state.username=u.username||u.first_name||'player';state.pfp=u.photo_url||''}
    applyIdentity();applyLayout(layoutMode);resizeIceCanvas();initWalletCard();
    setOnline(false);updateIndicator(false);requestAnimationFrame(renderLoop);refreshCardUI();
  }
  init();
  setTimeout(()=>{resizeIceCanvas();updateIndicator(false)},4200);
  window.addEventListener('orientationchange',()=>setTimeout(resizeIceCanvas,250));
  window.__state=state;
})();
</script>
